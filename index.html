<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="卡塔赞之塔团队战斗日志分析归档">
  <title>卡塔赞战斗档案</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #ece6d8;
      --muted: #a9a08e;
      --gold: #d6ad62;
      --gold-soft: rgba(214, 173, 98, .18);
      --line: rgba(214, 173, 98, .22);
      --panel: rgba(20, 24, 28, .86);
      --bg: #0b0e11;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "Noto Serif SC", serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(36, 86, 102, .25), transparent 34rem),
        radial-gradient(circle at 82% 78%, rgba(107, 60, 33, .19), transparent 38rem),
        repeating-linear-gradient(135deg, transparent 0 28px, rgba(255,255,255,.012) 29px 30px),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
    }
    main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 84px 0 96px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--gold);
      font: 600 12px/1.2 "Microsoft YaHei UI", sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 34px; height: 1px; background: var(--gold); }
    h1 {
      max-width: 780px;
      margin: 24px 0 18px;
      font-size: clamp(42px, 8vw, 88px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 800;
    }
    .intro { max-width: 620px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .rule { height: 1px; margin: 64px 0 22px; background: linear-gradient(90deg, var(--gold), var(--line) 38%, transparent); }
    .archive-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 16px; letter-spacing: .08em; }
    .count { color: var(--muted); font-size: 13px; }
    .reports { display: grid; gap: 12px; }
    .report {
      position: relative;
      display: grid;
      grid-template-columns: 78px 1fr auto;
      align-items: center;
      gap: 24px;
      min-height: 112px;
      padding: 20px 24px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
      animation: reveal .55s both;
    }
    .report::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    .report:hover, .report:focus-visible {
      transform: translateX(8px);
      border-color: rgba(214, 173, 98, .58);
      background: rgba(27, 31, 35, .95);
      outline: none;
    }
    .report:hover::after, .report:focus-visible::after { transform: scaleX(1); }
    .day {
      color: var(--gold);
      font: 800 38px/1 Georgia, serif;
      text-align: center;
      border-right: 1px solid var(--line);
    }
    .meta { color: var(--muted); font-size: 12px; letter-spacing: .12em; }
    .title { margin-top: 7px; font-size: 20px; font-weight: 700; }
    .arrow {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--gold);
      font-size: 20px;
    }
    footer { margin-top: 50px; color: #706a5f; font-size: 12px; }
    @keyframes reveal { from { opacity: 0; transform: translateY(14px); } }
    @media (max-width: 600px) {
      main { width: min(100% - 28px, 1080px); padding-top: 52px; }
      .rule { margin-top: 44px; }
      .report { grid-template-columns: 58px 1fr; gap: 16px; padding: 18px 16px; }
      .day { font-size: 30px; }
      .arrow { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .report { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">团队战斗日志档案</div>
    <h1>卡塔赞<br>战斗档案</h1>
    <p class="intro">按日期归档的团队战斗日志分析。每份报告包含职责判定、机制失误、灭团责任链、伤害、团队增益与消耗品审计。</p>
    <div class="rule"></div>
    <section aria-labelledby="archive-title">
      <div class="archive-head">
        <h2 id="archive-title">日期列表</h2>
        <span class="count">共 4 份报告</span>
      </div>
      <div class="reports">
        <a class="report" href="reports/2026-11-26/" style="animation-delay:0ms">
          <span class="day">26</span>
          <span>
            <span class="meta">2026 / 11 / 战斗报告</span>
            <span class="title">卡塔赞之塔战斗审计</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="report" href="reports/2026-11-18/" style="animation-delay:70ms">
          <span class="day">18</span>
          <span>
            <span class="meta">2026 / 11 / 战斗报告</span>
            <span class="title">卡塔赞之塔战斗审计</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="report" href="reports/2026-11-12/" style="animation-delay:140ms">
          <span class="day">12</span>
          <span>
            <span class="meta">2026 / 11 / 战斗报告</span>
            <span class="title">卡塔赞之塔战斗审计</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="report" href="reports/2026-11-05/" style="animation-delay:210ms">
          <span class="day">05</span>
          <span>
            <span class="meta">2026 / 11 / 战斗报告</span>
            <span class="title">卡塔赞之塔战斗审计</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
    <footer>数据来自 WoW 1.12.x / Turtle WoW 高级战斗日志。</footer>
  </main>
</body>
</html>
